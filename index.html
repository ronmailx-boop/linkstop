<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkStop</title>
  <meta name="description" content="ריכוז קישורים ששמרת מוואטסאפ, פייסבוק וכרום במקום אחד" />
  <meta name="theme-color" content="#7367f0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="src/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="src/icons/icon-192.png" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">LinkStop</h1>
    <p class="app-header__version">גרסה 15</p>
  </header>

  <main class="app-main">
    <form id="add-link-form" class="add-link-form">
      <label for="url-input" class="visually-hidden">הדבק קישור</label>
      <input
        id="url-input"
        name="url"
        type="url"
        inputmode="url"
        placeholder="הדבק קישור כאן..."
        autocomplete="off"
        required
      />
      <button id="add-button" type="submit">הוסף</button>
    </form>
    <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

    <div id="search-bar" class="search-bar" hidden>
      <label for="search-input" class="visually-hidden">חפש בין הקישורים השמורים</label>
      <input
        id="search-input"
        type="search"
        inputmode="search"
        placeholder="חפש קישור..."
        autocomplete="off"
      />
    </div>

    <div id="list-toolbar" class="list-toolbar" hidden>
      <button id="selection-enter" type="button" class="list-toolbar__link-button">בחירה מרובה</button>
    </div>

    <div id="selection-bar" class="selection-bar" hidden>
      <label class="selection-bar__select-all">
        <input id="selection-select-all" type="checkbox" />
        בחר הכל
      </label>
      <span id="selection-count" class="selection-bar__count" role="status" aria-live="polite"></span>
      <div class="selection-bar__actions">
        <button id="selection-cancel" type="button" class="confirm-dialog__button confirm-dialog__button--ghost">ביטול</button>
        <button id="selection-delete" type="button" class="confirm-dialog__button confirm-dialog__button--danger" disabled>מחק</button>
      </div>
    </div>

    <p id="empty-state" class="empty-state" hidden>
      עדיין לא שמרת קישורים. שתף קישור מוואטסאפ, פייסבוק או כרום ובחר ב-LinkStop, או הדבק קישור למעלה.
    </p>

    <ul id="links-list" class="links-list"></ul>
  </main>

  <div id="confirm-overlay" class="confirm-overlay" hidden>
    <div
      class="confirm-dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
    >
      <p id="confirm-dialog-title" class="confirm-dialog__title">מחיקת קישור</p>
      <p id="confirm-dialog-message" class="confirm-dialog__message"></p>
      <div class="confirm-dialog__actions">
        <button id="confirm-dialog-cancel" type="button" class="confirm-dialog__button confirm-dialog__button--ghost">ביטול</button>
        <button id="confirm-dialog-confirm" type="button" class="confirm-dialog__button confirm-dialog__button--danger">מחק</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
